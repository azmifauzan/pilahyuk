server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

  # SPA fallback (no router used today, but harmless)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache hashed assets
  location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|ico|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Never cache the entry doc — must always pull fresh build hashes
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
